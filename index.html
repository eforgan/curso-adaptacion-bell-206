<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso de Adaptación — Bell 206B JetRanger III</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   BELL 206B — CURSO DE ADAPTACIÓN · DISEÑO MODERNO
   ═══════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#06090f;
  --bg2:rgba(255,255,255,0.04);
  --bg3:rgba(255,255,255,0.07);
  --bg4:rgba(255,255,255,0.11);
  --amber:#f0a500;--amber2:#ffd060;--amber3:#ff8800;
  --blue:#0099ff;--blue2:#5cc8ff;
  --green:#00e0a8;--red:#ff4560;
  --text:#eef2ff;--text2:#8da0c4;--text3:#4a5a7a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --radius:12px;--radius2:18px;--radius3:24px;
  --g-amber:linear-gradient(135deg,#f0a500,#ff8800);
  --g-blue:linear-gradient(135deg,#0099ff,#5cc8ff);
  --g-green:linear-gradient(135deg,#00e0a8,#00b8d9);
  --shadow-card:0 8px 32px rgba(0,0,0,.5);
  --shadow-glow-amber:0 0 30px rgba(240,165,0,.25);
  --shadow-glow-blue:0 0 30px rgba(0,153,255,.25);
  --shadow-glow-green:0 0 30px rgba(0,224,168,.25);
}

/* ── MODO DÍA ─────────────────────────────────────── */
body.day{
  --bg:#f0f4ff;--bg2:rgba(255,255,255,.85);--bg3:rgba(230,235,250,.9);--bg4:rgba(210,220,240,.9);
  --amber:#c47800;--amber2:#7a4800;--amber3:#e06000;
  --blue:#0055cc;--blue2:#003eaa;
  --green:#007a5e;--red:#cc1133;
  --text:#0a0e1a;--text2:#1e2e50;--text3:#5a6888;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── CANVAS FONDO ─────────────────────────────────── */
#bg-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}
body.day #bg-canvas{opacity:.08}

/* ── APP WRAPPER ──────────────────────────────────── */
.app{
  position:relative;z-index:1;
  min-height:600px;max-width:840px;margin:0 auto;padding:18px 14px;
}

/* ── TIPOGRAFÍA ───────────────────────────────────── */
h1{
  font-size:24px;font-weight:800;letter-spacing:-.02em;
  background:var(--g-amber);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;color:var(--amber)}
p{font-size:14px;line-height:1.75;color:var(--text2)}
ul{padding-left:20px}li{font-size:14px;line-height:1.85;color:var(--text2)}
strong{color:var(--text)}
.metric{color:var(--blue2);font-size:.87em;font-style:italic}

/* ── GLASS CARDS ──────────────────────────────────── */
.card{
  background:var(--bg2);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border2);border-radius:var(--radius2);padding:20px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);
  transition:transform .3s,box-shadow .3s;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,.6)}

/* ── BOTONES ──────────────────────────────────────── */
.btn{
  padding:10px 22px;border-radius:var(--radius);
  border:1.5px solid var(--amber);background:transparent;
  color:var(--amber);cursor:pointer;font-size:14px;font-weight:600;
  font-family:inherit;position:relative;overflow:hidden;
  transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.01em;
}
.btn .ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.25);
  transform:scale(0);animation:ripple .5s linear;pointer-events:none;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.btn:hover{
  background:var(--amber);color:#000;
  box-shadow:0 0 24px rgba(240,165,0,.45),0 4px 16px rgba(0,0,0,.3);
  transform:translateY(-2px);
}
.btn-primary{
  background:var(--g-amber);color:#000;border-color:transparent;
  font-weight:700;box-shadow:0 0 20px rgba(240,165,0,.3),0 4px 12px rgba(0,0,0,.3);
}
.btn-primary:hover{
  box-shadow:0 0 40px rgba(240,165,0,.6),0 8px 24px rgba(0,0,0,.4);
  transform:translateY(-3px) scale(1.02);filter:brightness(1.1);
}
.btn-sm{padding:7px 16px;font-size:13px}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff;box-shadow:0 0 24px rgba(255,69,96,.45);border-color:transparent}
.btn-green{border-color:var(--green);color:var(--green)}
.btn-green:hover{background:var(--green);color:#000;box-shadow:0 0 24px rgba(0,224,168,.45);border-color:transparent}
.btn-blue{border-color:var(--blue2);color:var(--blue2)}
.btn-blue:hover{background:var(--blue2);color:#fff;box-shadow:0 0 24px rgba(92,200,255,.45);border-color:transparent}

/* ── BADGES ───────────────────────────────────────── */
.badge{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.badge-amber{background:rgba(240,165,0,.12);color:var(--amber);border:1px solid rgba(240,165,0,.35)}
.badge-green{background:rgba(0,224,168,.1);color:var(--green);border:1px solid rgba(0,224,168,.35)}
.badge-red{background:rgba(255,69,96,.1);color:var(--red);border:1px solid rgba(255,69,96,.35)}
.badge-blue{background:rgba(0,153,255,.1);color:var(--blue2);border:1px solid rgba(92,200,255,.35)}
.badge-gray{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

/* ── UTILIDADES ───────────────────────────────────── */
.tag{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:500}
.sep{height:1px;background:var(--border);margin:16px 0}
.flex{display:flex;align-items:center;gap:10px}
.flex-between{display:flex;align-items:center;justify-content:space-between}

/* ── BARRA DE PROGRESO ────────────────────────────── */
.progress-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--amber3),var(--amber),var(--amber2));
  transition:width .6s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.progress-fill::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:shimmer 2.2s ease-in-out infinite;
}
@keyframes shimmer{0%{left:-60%}100%{left:160%}}

/* ── FILAS DE DATOS ───────────────────────────────── */
.data-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);
  transition:background .15s;
}
.data-row:hover{background:var(--bg3);margin:0 -10px;padding:8px 10px;border-radius:8px;border-color:transparent}
.data-row:last-child{border-bottom:none}
.data-label{font-size:13px;color:var(--text2)}
.data-value{font-size:13px;font-weight:600;color:var(--amber2);text-align:right;max-width:62%}

/* ── CAJAS DE ALERTA ──────────────────────────────── */
.warn-box{
  background:linear-gradient(135deg,rgba(240,165,0,.09),rgba(240,165,0,.03));
  border:1px solid rgba(240,165,0,.22);border-left:3px solid var(--amber);
  border-radius:var(--radius);padding:12px 14px;margin:10px 0;
}
.warn-box p{font-size:13px;color:#d4a040;line-height:1.6}
.info-box{
  background:linear-gradient(135deg,rgba(0,153,255,.09),rgba(0,153,255,.03));
  border:1px solid rgba(92,200,255,.22);border-left:3px solid var(--blue2);
  border-radius:var(--radius);padding:12px 14px;margin:10px 0;
}
.info-box p{font-size:13px;color:var(--blue2);line-height:1.6}
.danger-box{
  background:linear-gradient(135deg,rgba(255,69,96,.1),rgba(255,69,96,.03));
  border:1px solid rgba(255,69,96,.28);border-left:3px solid var(--red);
  border-radius:var(--radius);padding:12px 14px;margin:10px 0;
}
.danger-box p{font-size:13px;color:#ff7080;line-height:1.6}

/* ── TÍTULO DE CAPÍTULO ───────────────────────────── */
.chapter-title{
  font-size:14px;font-weight:700;color:var(--blue2);
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  letter-spacing:.01em;
}

/* ── OPCIONES DE QUIZ ─────────────────────────────── */
.opt{
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:var(--radius);padding:13px 16px;cursor:pointer;
  font-size:14px;color:var(--text2);margin-bottom:9px;
  text-align:left;width:100%;font-family:inherit;
  transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
}
.opt::before{
  content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  transition:left .4s;
}
.opt:hover::before{left:150%}
.opt:hover{
  border-color:var(--amber);color:var(--text);
  background:rgba(240,165,0,.07);
  transform:translateX(5px);
  box-shadow:-4px 0 0 var(--amber),0 4px 16px rgba(0,0,0,.25);
}
.opt.selected{
  border-color:var(--amber);background:rgba(240,165,0,.1);
  color:var(--amber2);box-shadow:-4px 0 0 var(--amber);font-weight:500;
}
.opt.correct{
  border-color:var(--green);background:rgba(0,224,168,.1);
  color:var(--green);box-shadow:-4px 0 0 var(--green);font-weight:600;
  animation:correctFlash .4s ease-out;
}
.opt.incorrect{
  border-color:var(--red);background:rgba(255,69,96,.1);
  color:var(--red);box-shadow:-4px 0 0 var(--red);font-weight:500;
}
@keyframes correctFlash{0%{background:rgba(0,224,168,.3)}100%{background:rgba(0,224,168,.1)}}

/* ── PUNTOS DE EXAMEN ─────────────────────────────── */
.ep-dot{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;cursor:pointer;color:var(--text3);
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.ep-dot:hover{transform:scale(1.2);border-color:var(--amber);color:var(--amber)}
.ep-dot.answered{border-color:rgba(0,153,255,.6);background:rgba(0,153,255,.15);color:var(--blue2)}
.ep-dot.current{
  border-color:var(--amber);background:rgba(240,165,0,.2);color:var(--amber);
  box-shadow:0 0 14px rgba(240,165,0,.5);
  animation:pulseGold 1s ease-in-out infinite alternate;
}
@keyframes pulseGold{from{box-shadow:0 0 8px rgba(240,165,0,.4)}to{box-shadow:0 0 20px rgba(240,165,0,.8)}}
.ep-dot.correct{border-color:var(--green);background:rgba(0,224,168,.15);color:var(--green)}
.ep-dot.incorrect{border-color:var(--red);background:rgba(255,69,96,.15);color:var(--red)}

/* ── TARJETAS DE MÓDULO ───────────────────────────── */
.module-card{
  background:var(--bg2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius2);padding:18px;
  cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);margin-bottom:10px;
  position:relative;overflow:hidden;
}
.module-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--g-amber);transform:scaleY(0);transform-origin:bottom;
  transition:transform .3s cubic-bezier(.4,0,.2,1);border-radius:0 2px 2px 0;
}
.module-card:hover{
  border-color:rgba(240,165,0,.35);background:rgba(255,255,255,.06);
  transform:translateX(5px) translateY(-1px);
  box-shadow:-5px 0 0 var(--amber),0 12px 35px rgba(0,0,0,.4);
}
.module-card:hover::before{transform:scaleY(1)}
.module-card.locked{opacity:.42;cursor:not-allowed;filter:grayscale(.5)}
.module-card.locked:hover{transform:none;box-shadow:none;border-color:var(--border)}
.module-card.completed{border-color:rgba(0,224,168,.25)}
.module-card.completed::before{background:var(--g-green);transform:scaleY(1)}
.module-card.active{border-color:rgba(240,165,0,.25)}

/* ── ÁREA DE SCROLL ───────────────────────────────── */
.scroll-area{max-height:430px;overflow-y:auto;padding-right:6px}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-track{background:transparent}
.scroll-area::-webkit-scrollbar-thumb{
  background:linear-gradient(var(--amber3),var(--amber));
  border-radius:2px;
}

/* ── IMÁGENES ─────────────────────────────────────── */
.fig-img{
  width:100%;border:1px solid var(--border2);border-radius:var(--radius);
  margin:14px 0;background:#fff;display:block;
  transition:transform .3s,box-shadow .3s;
}
.fig-img:hover{transform:scale(1.015);box-shadow:0 10px 35px rgba(0,0,0,.5)}
.fig-caption{text-align:center;font-size:12px;color:var(--text3);margin:-10px 0 14px;font-style:italic}

/* ── FORMULARIOS ──────────────────────────────────── */
input[type=text],input[type=email],input[type=password],input[type=number]{
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:var(--radius);padding:11px 16px;color:var(--text);
  font-size:14px;width:100%;margin-bottom:12px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
}
/* Ocultar flechas de incremento/decremento en inputs numéricos */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
}
input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,165,0,.15)}
label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500}

/* ── MODAL ────────────────────────────────────────── */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.8);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  animation:fadeIn .2s;
}
.modal{
  background:linear-gradient(160deg,rgba(14,20,38,.98),rgba(8,12,24,.98));
  border:1px solid var(--border2);border-radius:var(--radius2);padding:28px;
  width:min(490px,95vw);max-height:85vh;overflow-y:auto;
  box-shadow:0 30px 70px rgba(0,0,0,.7);
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── TRANSICIONES DE VISTA ────────────────────────── */
.view-enter{animation:viewIn .35s cubic-bezier(.4,0,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── ADMIN ────────────────────────────────────────── */
.admin-link{
  position:fixed;bottom:16px;right:16px;font-size:18px;cursor:pointer;
  opacity:.15;transition:opacity .2s;background:none;border:none;color:var(--text3);
}
.admin-link:hover{opacity:.6}

/* ── BOTÓN TEMA ───────────────────────────────────── */
#theme-btn{
  position:fixed;top:13px;right:13px;z-index:999;width:40px;height:40px;
  border-radius:50%;border:1.5px solid var(--border2);
  background:var(--bg2);backdrop-filter:blur(12px);
  cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.35);color:var(--text);transition:transform .2s,box-shadow .2s;
}
#theme-btn:hover{transform:scale(1.12) rotate(18deg);box-shadow:0 0 24px rgba(240,165,0,.4)}
body,.card,input{transition:background .3s,color .3s,border-color .3s}

/* ── CONFETI ──────────────────────────────────────── */
#confetti-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:999;
}

/* ── HERO INTRO ───────────────────────────────────── */
.hero-heli{
  font-size:64px;
  animation:heliFloat 3s ease-in-out infinite;
  display:inline-block;filter:drop-shadow(0 0 20px rgba(240,165,0,.5));
}
@keyframes heliFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-10px) rotate(2deg)}
}

/* ── GLOW ORBS (decorativos) ──────────────────────── */
.glow-orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(90px);opacity:.3;animation:orbDrift 18s ease-in-out infinite;
}
.glow-orb.amber{background:radial-gradient(circle,rgba(240,165,0,.6),transparent 70%);
  width:400px;height:400px;top:-80px;right:-100px;}
.glow-orb.blue{background:radial-gradient(circle,rgba(0,153,255,.4),transparent 70%);
  width:350px;height:350px;bottom:-100px;left:-80px;animation-delay:-9s;}
@keyframes orbDrift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-30px) scale(1.08)}
  66%{transform:translate(-20px,20px) scale(.95)}
}
body.day .glow-orb{opacity:.1}

/* ── TARJETA MODULO — ICONO GRANDE ────────────────── */
.mod-icon-badge{
  width:42px;height:42px;border-radius:12px;
  background:var(--bg4);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  transition:transform .3s;
}
.module-card:hover .mod-icon-badge{transform:scale(1.12) rotate(-5deg)}

/* ── SCORE DISPLAY ────────────────────────────────── */
.score-big{
  font-size:52px;font-weight:800;letter-spacing:-.03em;
  background:var(--g-amber);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  animation:scorePop .5s cubic-bezier(.4,0,.2,1);
}
.score-big.green{background:var(--g-green);-webkit-background-clip:text;background-clip:text}
.score-big.red{background:linear-gradient(135deg,var(--red),#ff8080);-webkit-background-clip:text;background-clip:text}
@keyframes scorePop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* ── SEPARADOR GRADIENTE ──────────────────────────── */
.grad-sep{
  height:1px;margin:16px 0;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
}

/* ── SIDEBAR LAYOUT ────────────────────────────────── */
.app-container {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 20px;
  max-width: 1100px !important;
  margin: 0 auto;
}
@media (max-width: 768px) {
  .app-container {
    grid-template-columns: 1fr;
  }
}
.sidebar {
  background: var(--bg2);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border2);
  border-radius: var(--radius2);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: fit-content;
  position: sticky;
  top: 18px;
  box-shadow: var(--shadow-card);
  z-index: 50;
}
.sidebar-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--amber2);
  margin-bottom: 12px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
  letter-spacing: -0.01em;
}
.sidebar-btn {
  background: transparent;
  border: 1.5px solid transparent;
  color: var(--text2);
  padding: 10px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 13.5px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  width: 100%;
}
.sidebar-btn:hover {
  color: var(--text);
  background: var(--bg3);
}
.sidebar-btn.active {
  color: var(--amber2);
  border-color: var(--amber);
  background: rgba(240, 165, 0, 0.08);
  box-shadow: 0 0 10px rgba(240, 165, 0, 0.1);
}
.sidebar-profile {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text3);
  text-align: center;
}

/* ── PESO Y BALANCEO ───────────────────────────────── */
.wb-grid {
  display: grid;

    </div>`;
  }
  return false;
};

{title:"1.1 — El JetRanger III: Descripción General",
content:`<p>El <strong style="color:var(--amber2)">Bell Model 206B JetRanger III</strong> es un helicóptero utilitario de motor sencillo diseñado para despegar y aterrizar en cualquier terreno razonablemente nivelado. La configuración estándar es para un piloto y cuatro pasajeros.</p>
<img src="${IMGS.heli_overview}" class="fig-img" alt="Helicóptero JetRanger III">
<p class="fig-caption">Figura 1-1. Helicóptero JetRanger III — Secciones del fuselaje</p>
<div class="info-box"><p>Esta publicación es exclusivamente para capacitación en el Bell Model 206B-3. Para procedimientos y limitaciones actualizados, consultar los Manuales de Vuelo vigentes (BHT-206B-FM-1).</p></div>

<p><strong style="color:var(--amber2)">Estabilizador horizontal:</strong> Construido de aluminio, unido al cono de cola. Mantiene actitud casi nivelada a cualquier velocidad.</p>

content:`<div class="chapter-title">Límites TOT (Temperatura de Salida de Turbina)</div>
<div class="data-row"><span class="data-label">TOT máximo DESPEGUE (5 min)</span><span class="data-value" style="color:var(--red)">810°C</span></div>
<div class="data-row"><span class="data-label">TOT máximo CONTINUO</span><span class="data-value">738°C</span></div>
<div class="data-row"><span class="data-label">TOT máximo TRANSITORIO (5 seg)</span><span class="data-value">927°C</span></div>
<div class="chapter-title" style="margin-top:12px">Límites RPM y Torque</div>
<div class="data-row"><span class="data-label">N1 máximo</span><span class="data-value">105%</span></div>
<div class="data-row"><span class="data-label">Torque máximo despegue</span><span class="data-value">100% (5 minutos)</span></div>
<div class="data-row"><span class="data-label">Torque máximo transitorio</span><span class="data-value">110% (5 segundos)</span></div>
<div class="data-row"><span class="data-label">Potencia máxima continua (85% torque)</span><span class="data-value">270 SHP <span class='metric'>(201 kW)</span></span></div>
<div class="danger-box"><p>NUNCA exceder los límites del motor. El TOT por encima del máximo continuo puede dañar irreparablemente los álabes de la turbina.</p></div>
<div class="warn-box"><p>Días fríos → torque será el factor limitante. Días cálidos/grandes alturas → TOT será el factor limitante.</p></div>`},
{title:"3.3 — Sistema de Combustible",
content:`<img src="${IMGS.fuel_system}" class="fig-img" alt="Sección 6 — Sistema de Combustible">
<p class="fig-caption">Sistema de Combustible — Sección 6: celda vejiga debajo y detrás del asiento de pasajero</p>
<div class="data-row"><span class="data-label">Capacidad total tanque (S/N 3567+)</span><span class="data-value">91 gal <span class='metric'>(344 L)</span></span></div>
<div class="data-row"><span class="data-label">Capacidad usable</span><span class="data-value">76 gal <span class='metric'>(288 L)</span></span></div>
<div class="data-row"><span class="data-label">Tipo de tanque</span><span class="data-value">Vejiga, resistente a impactos</span></div>
<div class="data-row"><span class="data-label">Llenado</span><span class="data-value">Desde el lado derecho</span></div>
<div class="data-row"><span class="data-label">Bombas reforzadoras</span><span class="data-value">2 bombas eléctricas en el fondo de la celda</span></div>
<div class="chapter-title" style="margin-top:12px">Combustibles Aprobados</div>
<div class="data-row"><span class="data-label">Principal</span><span class="data-value">ASTM Tipo Jet B (JP-4) — cualquier temperatura</span></div>
<div class="data-row"><span class="data-label">Alternativo &gt; 0°F (-17.8°C)</span><span class="data-value">ASTM Tipo Jet A o A-1 (JP-5 o JP-8)</span></div>
<div class="data-row"><span class="data-label">Alternativo &lt; 0°F (-17.8°C)</span><span class="data-value">Mezcla 80/87 AVGAS y Tipo Jet A y A-1</span></div>`},
{title:"3.4 — Procedimiento de Drenaje de Combustible",
content:`<p>Antes del primer vuelo del día se debe drenar y revisar la muestra de combustible del sumidero de la celda y del filtro del fuselaje.</p>
<div class="data-row"><span class="data-label">Paso 1</span><span class="data-value">Rompe-circuitos FUEL BOOST AFT y FWD — Fuera</span></div>
<div class="data-row"><span class="data-label">Paso 2</span><span class="data-value">Interruptor BAT — ON</span></div>
<div class="data-row"><span class="data-label">Paso 3</span><span class="data-value">Interruptor FUEL VALVE — OFF</span></div>
<div class="data-row"><span class="data-label">Paso 4</span><span class="data-value">Botón drenaje de combustible — Oprimir, tomar muestra, soltar</span></div>
<div class="chapter-title" style="margin-top:12px">Filtro de Combustible del Fuselaje</div>
<div class="data-row"><span class="data-label">Paso 1</span><span class="data-value">Interruptor FUEL VALVE — ON</span></div>
<div class="data-row"><span class="data-label">Paso 2</span><span class="data-value">Rompe-circuitos FUEL BOOST AFT y FWD — Adentro</span></div>
<div class="data-row"><span class="data-label">Paso 3</span><span class="data-value">Rompe circuito CAUTION LT — Adentro</span></div>
<div class="data-row"><span class="data-label">Paso 4</span><span class="data-value">Válvula de drenaje del filtro — Abrir, obtener muestra, cerrar</span></div>
<div class="warn-box"><p>No arrancar el motor si la muestra de combustible tiene agua, sedimentos o contaminación. Consultar a mantenimiento antes de proceder.</p></div>`}
],

{id:4,title:"Fuselaje, Transmisión y Sistemas",subtitle:"Secciones 4, 7, 8, 9, 10, 11 — Estructura, hidráulico, eléctrico",icon:"🔧",
chapters:[
{title:"4.1 — Transmisión y Tren Impulsor",
content:`<p>El sistema de transmisión transmite la potencia del motor al rotor principal y de cola. El eje impulsor principal conecta la salida del motor con la caja de engranajes de la transmisión principal.</p>
<img src="${IMGS.transmission}" class="fig-img" alt="Transmisión y tren impulsor">
<p class="fig-caption">Transmisión y tren impulsor — inspección de componentes críticos</p>
<div class="chapter-title">Puntos Críticos de Inspección en Preflight</div>
<div class="data-row"><span class="data-label">Pasador de arrastre</span><span class="data-value">Seguridad y evidencia de contacto con placa tape estático</span></div>
<div class="data-row"><span class="data-label">Acople delantero eje impulsor</span><span class="data-value">Condición y fugas de grasa — tiras café = calor excesivo</span></div>
<div class="data-row"><span class="data-label">Transmisión — aceite</span><span class="data-value">Nivel y fugas en el área</span></div>
<div class="data-row"><span class="data-label">Montaje aislante</span><span class="data-value">Condición</span></div>
<div class="warn-box"><p>Las tiras indicadoras de calentamiento excesivo de color café en el acople delantero del eje impulsor principal indican posible falla grave. Reportar inmediatamente a mantenimiento, no realizar el vuelo.</p></div>`},
{title:"4.2 — Fuselaje: Sección Intermedia y Cono de Cola",
content:`<p>La <strong style="color:var(--amber2)">sección intermedia</strong> es semimonocasco con plataforma del motor, compartimiento equipaje y compartimiento equipo. Cubierta por pieles de aleación de aluminio y carenaje de fibra de vidrio en el extremo inferior trasero.</p>
<p style="margin-top:8px">Hay un <strong style="color:var(--amber2)">recipiente de titanio</strong> debajo del motor que sirve para recibir el goteo y como pared de fuego. Es curvo para permitir quitar accesorios sin remover el motor.</p>
<div class="chapter-title" style="margin-top:12px">Puerta de Carga</div>
<p>Tiene un <strong style="color:var(--amber2)">microswitch</strong> hacia la luz de aviso. Está a la izquierda del fuselaje con bisagras en el extremo delantero. Se abre a todo lo ancho y alto. Asegurada con dos cerraduras de botones y una cerradura con llave.</p>
<div class="chapter-title" style="margin-top:12px">Cono de Cola</div>
<p>Estructura monocasco. Soporta al <strong style="color:var(--amber2)">eje impulsor del rotor de cola, rotor de cola, caja de engranajes, estabilizador vertical y estabilizador horizontal</strong>.</p>
<div class="data-row"><span class="data-label">Cubierta caja engranajes rotor cola</span><span class="data-value">Aleación de aluminio</span></div>
<div class="data-row"><span class="data-label">Estabilizador horizontal</span><span class="data-value">Aluminio — costilla interior fija al cono de cola</span></div>`},
{title:"4.3 — Sistema Hidráulico",
content:`<p>El sistema hidráulico del JetRanger proporciona asistencia hidráulica a los <strong style="color:var(--amber2)">controles cíclico y colectivo</strong>, reduciendo el esfuerzo del piloto.</p>
<img src="${IMGS.hydraulic}" class="fig-img" alt="Verificación del sistema hidráulico">
<p class="fig-caption">Verificación preliminar del sistema hidráulico — procedimiento correcto</p>
<div class="chapter-title">Verificación Hidráulica en Corrida de Motor</div>
<div class="data-row"><span class="data-label">Acelerador</span><span class="data-value">Abierto a 70% RPM productora de gas</span></div>
<div class="data-row"><span class="data-label">Gobernador N2</span><span class="data-value">Verificar rango 97 a 100% RPM</span></div>
<div class="data-row"><span class="data-label">Interruptor HYD SYSTEM o CTRL BOOST</span><span class="data-value">OFF — luego ON</span></div>
<div class="info-box"><p>Si el control cíclico se mueve por sí mismo o motoriza con el sistema hidráulico apagado, ello puede indicar una falla del sistema hidráulico. Consultar a mantenimiento.</p></div>
<div class="chapter-title" style="margin-top:12px">Lubricante aprobado (sistema hidráulico)</div>
<div class="data-row"><span class="data-label">Especificación</span><span class="data-value">MIL-H-5606 — 1 pinta en depósito, 1 pinta en sistema</span></div>`},
{title:"4.4 — Sistema Eléctrico y Controles de Vuelo",
content:`<div class="chapter-title">Sistema Eléctrico</div>
<div class="data-row"><span class="data-label">Interruptor BAT</span><span class="data-value">Alimentación principal de batería</span></div>
<div class="data-row"><span class="data-label">Interruptor GEN</span><span class="data-value">Generador — carga normal 10-20%</span></div>
<div class="data-row"><span class="data-label">Carga máxima normal pre-despegue</span><span class="data-value">Por debajo del 70%</span></div>
<div class="data-row"><span class="data-label">Interruptor INST LT (reóstato)</span><span class="data-value">Iluminación de instrumentos</span></div>
<div class="chapter-title" style="margin-top:12px">Controles de Vuelo</div>
<div class="data-row"><span class="data-label">Cíclico</span><span class="data-value">Control de actitud y velocidad horizontal. Fricción ajustable.</span></div>
<div class="data-row"><span class="data-label">Colectivo</span><span class="data-value">Control de paso colectivo y potencia. Fricción ajustable.</span></div>
<div class="data-row"><span class="data-label">Pedales</span><span class="data-value">Control de paso del rotor de cola (guiñada)</span></div>
<div class="data-row"><span class="data-label">Acelerador</span><span class="data-value">En mango del colectivo, controla N2/RPM del motor</span></div>
<div class="info-box"><p>El torquímetro indica el porcentaje de torque del motor. Es el instrumento primario para verificación de potencia junto con el TOT e indicadores N1 y N2.</p></div>`}
],

{q:"¿Para qué sirve el recipiente de titanio ubicado debajo del motor?",opts:["Almacenar aceite extra de reserva","Recibir el goteo y actuar como pared de fuego","Soporte estructural del motor","Ventilación del compartimiento motor"],ans:1},
{q:"¿Qué tipo de estructura es el cono de cola del JetRanger III?",opts:["Semimonocasco","Monocasco","Estructura de panal de abeja","Largueros y costillas"],ans:1},
{q:"¿Qué indica una tira indicadora de color café en el acople delantero del eje impulsor?",opts:["Que el aceite debe cambiarse","Evidencia de calentamiento excesivo — no volar","Lubricación insuficiente reciente","Alineación incorrecta del eje"],ans:1},
{q:"¿Cuántos cojinetes y pernos conectan cada pala del rotor de cola al yugo común?",opts:["3 cojinetes y 2 pernos","2 cojinetes y 2 pernos","4 cojinetes y 4 pernos","1 cojinete y 4 pernos"],ans:1},
{q:"¿Cuál es la carga normal del generador durante la operación?",opts:["50 al 70%","Por encima del 80%","10 al 20%","30 al 50%"],ans:2}
]},
{id:5,title:"Rendimiento, Peso y Balance",subtitle:"Secciones 12 y 13 — Verificación de potencia, datos de desempeño",icon:"📊",
chapters:[
{title:"5.1 — Verificación de Potencia",
content:`<p>Los datos de rendimiento se aplican al motor <strong style="color:var(--amber2)">250-C20B/C20J</strong>. La gráfica indica el porcentaje mínimo de torque que debe haber disponible de un motor que cumple los requerimientos mínimos de Allison.</p>
<img src="${IMGS.power_check}" class="fig-img" alt="Power Check Chart">
<p class="fig-caption">Figura 12-1. Gráfica de Verificación de Potencia — Motor Allison 250-C20B/C20J</p>
<div class="chapter-title">Método preferido — ascenso a 60 MPH (52 nudos)</div>
<p>Se pueden hacer verificaciones de potencia exactas en un ascenso a <strong style="color:var(--amber2)">60 mph <span class='metric'>(97 km/h)</span> (52 nudos) IAS</strong> agregando <strong style="color:var(--amber2)">2% a la lectura de la gráfica de porcentaje de torque</strong>.</p>
<div class="warn-box"><p>Para verificación de potencia, asegurar que ENGINE DEICING/ANTI-ICING y el switch GEN estén OFF. Levantar colectivo hasta TOT estabilizado o alcanzar límite de torque. Anotar OAT, TOT, presión, altitud, torque y N1.</p></div>`},
{title:"5.2 — Régimen de Ascenso",
content:`<p>El <strong style="color:var(--amber2)">régimen de ascenso</strong> en la gráfica se denomina "TAPELINE RATE OF CLIMB". Mide el régimen real en un día estándar con gradiente vertical de temperatura estándar.</p>
<img src="${IMGS.rate_of_climb}" class="fig-img" alt="Rate of Climb Chart">
<p class="fig-caption">Figura 12-2. Rate of Climb — Máximo, potencia de despegue, Anti-ice OFF o ON (unidades inglesas)</p>
<div class="chapter-title">Corrección por Anti-Hielo</div>
<div class="data-row"><span class="data-label">Anti-Hielo OFF — R/C base</span><span class="data-value">Leer directamente de la gráfica</span></div>
<div class="data-row"><span class="data-label">Con Anti-Hielo ON (en el ejemplo)</span><span class="data-value">Disminuir ΔR/C = 240 ft/min</span></div>
<div class="data-row"><span class="data-label">Ejemplo: Anti-ice OFF 890 ft/min</span><span class="data-value">Anti-ice ON = 890 − 240 = 650 ft/min <span class='metric'>(198 m/min)</span></span></div>
<div class="data-row"><span class="data-label">Operación sin puertas</span><span class="data-value">Reducir datos base en 350 ft/min</span></div>
<div class="info-box"><p>Generador: 22.3 Amps. Condición: N2 = 100% RPM, V IND = 60 MPH (52 KIAS).</p></div>`},
{title:"5.3 — Techo de Vuelo Estacionario: IGE y OGE",
content:`<p>Las gráficas de Techo de Vuelo Estacionario muestran el desempeño en vuelo estacionario (peso bruto permitido) en condiciones de presión altitud y OAT. Se dividen en dos áreas:</p>
<ul>
<li><strong style="color:var(--amber2)">ÁREA A (blanca):</strong> Control demostrado con vientos de lado y de cola de hasta 20 mph (17 nudos)</li>
<li><strong style="color:var(--amber2)">ÁREA B (sombreada):</strong> Solo vientos calmados o fuera del Área Crítica de Viento Azimuth</li>
</ul>
<img src="${IMGS.wind_azimuth}" class="fig-img" alt="Critical Wind Azimuth">
<p class="fig-caption">Figura 12-3. Área crítica de viento relativo Azimuth</p>
<div class="danger-box"><p>El TOT del motor se incrementa notablemente en vuelo estacionario a favor del viento (downwind). Evitar este vuelo al operar cerca de los límites de TOT.</p></div>
<img src="${IMGS.hover_ige}" class="fig-img" alt="Hover Ceiling IGE">
<p class="fig-caption">Figura 12-4. Techo de vuelo estacionario con efecto en tierra (IGE) — Potencia de despegue, 0° a 46°C, Anti-ice OFF</p>
<img src="${IMGS.hover_oge}" class="fig-img" alt="Hover Ceiling OGE">
<p class="fig-caption">Figura 12-5. Techo de vuelo estacionario fuera del efecto en tierra (OGE) — Potencia de despegue, 0° a 46°C, Anti-ice OFF</p>
<div class="warn-box"><p>Con Anti-Hielo ON: IGE restar 220 lb (99.8 kg) — OGE restar 295 lb (133.8 kg) del peso bruto. Condiciones: Generador 22.3 A, altura de patines 2 ft (IGE) y 40 ft (OGE), N2 100%.</p></div>`},
{title:"5.4 — Diagrama Altura-Velocidad y Peso/Balance",
content:`<p>El <strong style="color:var(--amber2)">Diagrama Altura-Velocidad (H-V)</strong> define las condiciones desde las cuales se puede hacer un aterrizaje seguro en superficie plana, nivelada y firme después de una falla del motor. Es válido solo cuando el peso bruto no excede los límites de Altitud vs Peso Bruto.</p>
<img src="${IMGS.height_velocity}" class="fig-img" alt="Height-Velocity Diagram">
<p class="fig-caption">Figura 12-6. Diagrama Altura-Velocidad — Superficies lisas, niveladas y firmes</p>
<div class="danger-box"><p>EVITAR OPERAR EN EL ÁREA SOMBREADA. Las condiciones dentro del área sombreada no permiten garantizar un aterrizaje seguro después de una falla del motor.</p></div>
<div class="chapter-title" style="margin-top:12px">Peso y Balance — Ejemplo de Cálculo</div>
<img src="${IMGS.weight_balance}" class="fig-img" alt="Tabla Peso y Balance">
<p class="fig-caption">Sección 13. Tabla de Peso y Balance — Ejemplo de vuelo de salida y retorno (PESO / CG / MOMENTO)</p>
<div class="data-row"><span class="data-label">Peso bruto máximo (interno)</span><span class="data-value">3,200 libras (1,451.5 kg)</span></div>
<div class="data-row"><span class="data-label">Peso bruto máximo (externo)</span><span class="data-value">3,350 libras (1,519.6 kg)</span></div>
<div class="data-row"><span class="data-label">CG lateral máximo izquierdo</span><span class="data-value">3.0 pulgadas (76.2 mm)</span></div>
<div class="data-row"><span class="data-label">CG lateral máximo derecho</span><span class="data-value">4.0 pulgadas (101.6 mm)</span></div>
<div class="info-box"><p>El CG se mueve agregando o quitando peso. Siempre verificar el Manual de Peso y Balance específico de la aeronave para los límites exactos del CG y la envolvente de vuelo aprobada.</p></div>`}
],

{q:"¿Cuál es el peso bruto máximo del Bell 206B JetRanger III (operación interna)?",opts:["2,850 libras","3,000 libras","3,200 libras (1,451.5 kg)","3,500 libras"],ans:2},
{q:"¿Cuál es el límite de torque para la operación de despegue?",opts:["85% tiempo ilimitado","100% máximo 5 minutos","95% máximo 10 minutos","110% máximo 2 minutos"],ans:1},
{q:"Para una verificación de potencia más exacta en ascenso, ¿qué velocidad y corrección se aplica?",opts:["80 mph (69 nudos) sin corrección","100 mph menos 5% de torque","60 mph <span class='metric'>(97 km/h)</span> (52 nudos) agregando 2% al torque leído","70 mph sin corrección"],ans:2},
{q:"¿Cuál es el TOT máximo para operación continua?",opts:["810°C","850°C","700°C","738°C"],ans:3},
{q:"Para pesos superiores a 3,000 libras, ¿cuál es la altitud máxima de densidad?",opts:["20,000 pies <span class='metric'>(6.096 m)</span>","15,000 pies <span class='metric'>(1.524 m)</span>","13,500 pies <span class='metric'>(4.115 m)</span>","10,000 pies"],ans:2}
]},
{id:6,title:"Procedimientos Normales y de Emergencia",subtitle:"Secciones 14 y 15 — Arranque, vuelo, autorrotación, fallas",icon:"🚁",
chapters:[
{title:"6.1 — Inspección Preflight (Puntos Clave)",
content:`<p>La inspección preflight es obligatoria antes de cada vuelo. Incluye verificaciones sistemáticas de todos los sistemas.</p>
<div class="chapter-title">Área de Transmisión</div>
<div class="data-row"><span class="data-label">Transmisión</span><span class="data-value">Nivel de aceite y fugas</span></div>
<div class="data-row"><span class="data-label">Montaje aislante</span><span class="data-value">Condición</span></div>
<div class="data-row"><span class="data-label">Pasador de arrastre</span><span class="data-value">Seguridad y evidencia de contacto con placa tape estático</span></div>
<div class="data-row"><span class="data-label">Acople delantero eje impulsor</span><span class="data-value">Condición, fugas de grasa, tiras indicadoras</span></div>
<div class="data-row"><span class="data-label">Cubierta de inducción de aire</span><span class="data-value">Asegurada</span></div>
<div class="data-row"><span class="data-label">Toma y cámara del motor</span><span class="data-value">Condición, libre de obstrucciones</span></div>
<div class="data-row"><span class="data-label">Tapa de la toma de combustible</span><span class="data-value">Revisar nivel visualmente, asegurar la tapa</span></div>
<div class="data-row"><span class="data-label">Puerta de acceso</span><span class="data-value">Asegurada</span></div>
<div class="warn-box"><p>Instalar los amarres del rotor principal y de cola si hay: pronóstico de vientos fuertes, otros helicópteros operando en el área, o si se va a dejar el helicóptero desatendido.</p></div>`},
{title:"6.2 — Arranque del Motor y Pre-Despegue",
content:`<div class="chapter-title">Secuencia Antes de Despegar</div>
<div class="data-row"><span class="data-label">Equipo eléctrico</span><span class="data-value">Verificar y restablecer (reset) según se requiera</span></div>
<div class="data-row"><span class="data-label">Iluminación — INST LT (reóstato)</span><span class="data-value">Según se desee</span></div>
<div class="data-row"><span class="data-label">Radio</span><span class="data-value">Probar que funcione</span></div>
<div class="data-row"><span class="data-label">Acelerador</span><span class="data-value">TODO ABIERTO</span></div>
<div class="data-row"><span class="data-label">Instrumentos de potencia y vuelo</span><span class="data-value">En el rango normal de operación</span></div>
<div class="data-row"><span class="data-label">Carga del generador</span><span class="data-value">Abajo de 70% (normal: 10-20%)</span></div>
<div class="data-row"><span class="data-label">Turbina de potencia N2</span><span class="data-value">100% con el colectivo abajo</span></div>
<div class="chapter-title" style="margin-top:12px">Despegue</div>
<div class="data-row"><span class="data-label">Colectivo</span><span class="data-value">Aumentar para pasar a vuelo estacionario</span></div>
<div class="data-row"><span class="data-label">Control direccional</span><span class="data-value">Mantener el rumbo deseado</span></div>
<div class="data-row"><span class="data-label">Cíclico</span><span class="data-value">Aplicar lo necesario para acelerar suavemente</span></div>

let state = { ...defaultState };

function loadState(){
  try{
    const s = localStorage.getItem('bell206_state');
    if(s){
      const parsed = JSON.parse(s);
      state = { ...defaultState, ...parsed };
      state.weight_balance = { ...defaultState.weight_balance, ...parsed.weight_balance };
      state.performance = { ...defaultState.performance, ...parsed.performance };
      state.checkedItems = { ...defaultState.checkedItems, ...parsed.checkedItems };
    }
  }catch(e){}
}
function saveState(){
  try{
    const {adminOpen,...toSave}=state;
    localStorage.setItem('bell206_state',JSON.stringify(toSave));
  }catch(e){}
}
loadState();

  state.view = v;
  render();
};

  const email = document.getElementById('reg-email').value.trim();
  const errDiv = document.getElementById('reg-error');
  
  if (!nombre || !apellido || !licencia || !email) {
    errDiv.style.display = 'block';
    errDiv.textContent = 'Por favor, complete todos los campos obligatorios.';
    return;
  }
  
  if (!email.includes('@') || !email.includes('.')) {
    errDiv.style.display = 'block';
    errDiv.textContent = 'Por favor, ingrese un correo electrónico válido.';
    return;
  }
  
  errDiv.style.display = 'none';
  state.user = { nombre, apellido, licencia, email };
  saveState();
  setView('map');
};

function downloadAdminKeys(){
  const lines=[];
  lines.push('CLAVE DE RESPUESTAS — CURSO DE ADAPTACIÓN BELL 206B JETRANGER III');
  lines.push('DOCUMENTO CONFIDENCIAL — SOLO PARA EL ADMINISTRADOR DEL CURSO');
  lines.push('='.repeat(70));
  lines.push('Basado en: Bell 206BIII P/G SPN 10/98');
  lines.push('Referencia regulatoria: ANAC Argentina / RAAC Parte 61 y 91');
  lines.push('');
  MODULES.forEach((m,mi)=>{
    lines.push('');lines.push('='.repeat(70));
    lines.push(`MÓDULO ${m.id}: ${m.title.toUpperCase()}`);lines.push('='.repeat(70));
    m.quiz.forEach((q,qi)=>{
      lines.push(`\nPregunta M${m.id}.${qi+1}: ${q.q}`);
      q.opts.forEach((o,oi)=>lines.push(`  ${String.fromCharCode(65+oi)}. ${o}${oi===q.ans?' ◄ CORRECTA':''}`));
    });
  });
  lines.push('');lines.push('='.repeat(70));
  lines.push('EXAMEN FINAL INTEGRADOR (30 PREGUNTAS)');lines.push('='.repeat(70));
  FINAL_EXAM.forEach((q,i)=>{
    lines.push(`\nPregunta F${i+1}: ${q.q}`);
    q.opts.forEach((o,oi)=>lines.push(`  ${String.fromCharCode(65+oi)}. ${o}${oi===q.ans?' ◄ CORRECTA':''}`));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);

  a.href=url;a.download='Bell206B3_ClaveAdmin_CONFIDENCIAL.txt';

}

// ========= EMAIL SENDING =========
async function sendCertificateEmails(doc, safeName, score, pct){
  const statusEl = document.getElementById('email-status-msg');
  if(!statusEl) return;

  if(!EMAIL_CFG.publicKey || !EMAIL_CFG.serviceId || !EMAIL_CFG.templateId){
    statusEl.className='email-status error';
    statusEl.innerHTML='⚠ Email no configurado. Configure EmailJS en el Panel Administrador para enviar emails automáticos.';
    statusEl.style.display='block';
    return;
  }

  statusEl.className='email-status sending';
  statusEl.innerHTML='📧 Enviando certificado por email... por favor espere.';
  statusEl.style.display='block';

  const now = new Date();
  const dateStr = now.toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  const pdfBase64 = doc.output('datauristring');
  const nombre = `${state.user.nombre} ${state.user.apellido}`;

  const templateParams = {
    to_name:     nombre,
    to_email:    state.user.email,
    licencia:    state.user.licencia,
    score:       `${score}/30 (${pct}%)`,
    fecha:       dateStr,
    aeronave:    'Bell Model 206B JetRanger III',
    instructor:  'Eduardo J. Forgan',
    cc_email:    EMAIL_CFG.ccEmail,
    pdf_nombre:  `Certificado_Bell206B3_${safeName}.pdf`,
    pdf_base64:  pdfBase64,
  };

  try{
    // Send to student
    await emailjs.send(EMAIL_CFG.serviceId, EMAIL_CFG.templateId, {
      ...templateParams,
      reply_to: EMAIL_CFG.ccEmail,
    });

    // Send copy to instructor
    await emailjs.send(EMAIL_CFG.serviceId, EMAIL_CFG.templateId, {
      ...templateParams,
      to_name:  'Eduardo J. Forgan',
      to_email: EMAIL_CFG.ccEmail,
      reply_to: state.user.email,
      asunto_prefijo: '[COPIA] '
    });

    statusEl.className='email-status sent';
    statusEl.innerHTML=`✅ Certificado enviado exitosamente a <strong>${state.user.email}</strong> y copia a <strong>${EMAIL_CFG.ccEmail}</strong>`;
  } catch(err){
    console.error('EmailJS error:', err);
    statusEl.className='email-status error';
    statusEl.innerHTML=`❌ Error al enviar email: ${err?.text||JSON.stringify(err)}. El certificado ya fue descargado localmente.`;
  }
}

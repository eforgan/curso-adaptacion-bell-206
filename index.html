<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso de Adaptación — Bell 206B JetRanger III</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="style.css?v=2">

</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div class="glow-orb amber"></div>
<div class="glow-orb blue"></div>
<div class="app" id="root"></div>
<script src="app.js?v=2"></script>

<button id="theme-btn" title="Modo diurno/nocturno">🌙</button>

<!-- ══ BACKGROUND CANVAS ANIMATION ══════════════════════ -->
<script>
(function(){
  const c=document.getElementById('bg-canvas');
  const ctx=c.getContext('2d');
  let W,H,particles=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  function Particle(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.r=Math.random()*1.5+.3;
    this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;
    this.alpha=Math.random()*.6+.1;
    this.color=Math.random()>.7?'240,165,0':Math.random()>.5?'0,153,255':'255,255,255';
  }
  for(let i=0;i<140;i++) particles.push(new Particle());
  // Grid lines
  function drawGrid(){
    ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=.5;
    const gs=80;
    for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    drawGrid();
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.color},${p.alpha})`;ctx.fill();
    });
    // Connect nearby particles
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<100){
          ctx.beginPath();
          ctx.strokeStyle=`rgba(240,165,0,${.08*(1-dist/100)})`;
          ctx.lineWidth=.5;
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

<!-- ══ CONFETTI ════════════════════════════════════════ -->
<script>
function launchConfetti(big){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const count=big?200:100;
  const confetti=[];
  const colors=['#f0a500','#ffd060','#00e0a8','#5cc8ff','#ff4560','#ffffff','#ff8800'];
  for(let i=0;i<count;i++){
    confetti.push({
      x:Math.random()*canvas.width,
      y:-10-Math.random()*200,
      w:Math.random()*10+4,h:Math.random()*6+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      vx:(Math.random()-0.5)*4,
      vy:Math.random()*4+2,
      rot:Math.random()*360,vr:(Math.random()-0.5)*8,
      alpha:1
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c=>{
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot*Math.PI/180);
      ctx.globalAlpha=c.alpha;ctx.fillStyle=c.color;
      ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();
      c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;c.vy+=.05;
      if(frame>80)c.alpha-=.015;
    });
    frame++;
    if(frame<160)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
</script>

<!-- ══ THEME TOGGLE ════════════════════════════════════ -->
<script>
(function(){
  var b=document.getElementById("theme-btn");
  function a(t){document.body.classList.toggle("day",t==="day");b.textContent=t==="day"?"☀️":"🌙";}
  a(localStorage.getItem("theme")||"night");
  b.onclick=function(){var d=document.body.classList.contains("day");localStorage.setItem("theme",d?"night":"day");a(d?"night":"day");};
})();
</script>
</body></html>
